metric:
  name: Average Lot Price
  identifier: avg_ticket_price
  description: Average consumer price per recurring lot, weighted by tickets in
    play across the standard (€16), Plus (€18.50) and Premium (€21) tiers of
    Nationale Postcode Loterij and the VriendenLoterij price points. Excludes
    promotional discounts absorbed centrally. This price, multiplied by tickets
    in play, yields gross inleg, so it is a key sensitivity for turnover and
    afdracht. Movements reflect deliberate tier repricing or shifts in product
    mix rather than daily volatility.
  synonyms:
    - lot price
  unit: EUR
  status: Implemented
  period: Monthly
  businessOwner: Finance Team
  implementationOwner: null
  source: FIN_LEDGER
  release: null
  formula: null
  slices:
    - LOTTERY_BRAND
    - MONTH
    - PRODUCT_TIER
  excludedSlices: []
  upstreamMetrics: []
  downstreamMetrics: []
  impactedMetrics: []
  impactingMetrics: []
  tags:
    - pricing
