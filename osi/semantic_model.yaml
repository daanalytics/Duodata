                computed as afdracht minus minimum required afdracht. A positive
                value confirms compliance with the 40% rule with margin; a
                negative value signals licence risk requiring corrective
                allocation. Excludes ANBI-share compliance. Sensitive to inleg
                growth timing versus allocation decisions. Used by compliance to
                trigger year-end top-ups to good causes.
