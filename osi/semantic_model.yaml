osi_version: "1.0"
semantic_model:
  name: duodata
  datasets:
    - name: CRM_SHARED
      description: Cross-brand customer relationship system holding subscriber,
        ticket, campaign and channel records for both Nationale Postcode Loterij
        and VriendenLoterij. System of record for participant identity,
        acquisition and churn events.
      fields:
        - name: CAMPAIGN_BK
          custom_extensions:
            duodata:
              name: Campaign
              identifier: CAMPAIGN_BK
              description: Grain of an acquisition or retention marketing campaign
                attributable to subscription events, used for CAC and
                channel-effectiveness analysis.
              synonyms:
                - Marketing Campaign
              status: Proposed
              businessOwner: null
              implementationOwner: null
              source: CRM_SHARED
              release: null
              values: null
              rollsUpTo:
                - CHANNEL
                - LOTTERY_BRAND
              tags:
                - Participant-Growth
          description: Grain of an acquisition or retention marketing campaign
            attributable to subscription events, used for CAC and
            channel-effectiveness analysis.
          ai_context: Marketing Campaign
        - name: PARTICIPANT_BK
          custom_extensions:
            duodata:
              name: Participant
              identifier: PARTICIPANT_BK
              description: Grain of a distinct subscriber (deelnemer) holding at least one
                active ticket in either lottery brand. Spine entity for
                acquisition, churn, tickets-per-participant and
                household-overlap analysis.
              synonyms:
                - Subscriber
                - Deelnemer
              status: Proposed
              businessOwner: null
              implementationOwner: null
              source: CRM_SHARED
              release: null
              values: null
              rollsUpTo:
                - CHANNEL
                - COHORT
                - LEGAL_ENTITY
                - LOTTERY_BRAND
                - PARTICIPANT_TYPE
                - POSTCODE
              tags:
                - Cross-Brand
                - Participant-Growth
          description: Grain of a distinct subscriber (deelnemer) holding at least one
            active ticket in either lottery brand. Spine entity for acquisition,
            churn, tickets-per-participant and household-overlap analysis.
          ai_context: Subscriber; Deelnemer
        - name: SUBSCRIPTION_BK
          custom_extensions:
            duodata:
              name: Ticket / Subscription
              identifier: SUBSCRIPTION_BK
              description: Grain of a recurring lot (lot) held by a participant, defining
                product tier, brand, status and the stake collected each draw.
                Basis for tickets in play and inleg identity (tickets × price).
              synonyms:
                - Lot
                - Recurring Lot
                - Subscription
              status: Proposed
              businessOwner: null
              implementationOwner: null
              source: CRM_SHARED
              release: null
              values: null
              rollsUpTo:
                - CAMPAIGN_BK
                - CHANNEL
                - LOTTERY_BRAND
                - PARTICIPANT_BK
                - PRODUCT_TIER
                - SUBSCRIPTION_STATUS
              tags:
                - Participant-Growth
          description: Grain of a recurring lot (lot) held by a participant, defining
            product tier, brand, status and the stake collected each draw. Basis
            for tickets in play and inleg identity (tickets × price).
          ai_context: Lot; Recurring Lot; Subscription
      metrics:
        - name: active_participants
          expression: ""
          custom_extensions:
            duodata:
              name: Active Participants (Deelnemers)
              identifier: active_participants
              description: Distinct subscribers holding at least one active recurring lot in
                the period, across both brands and all acquisition channels.
                Deduplicated on participant, so a person holding multiple lots
                or both brands counts once per brand grain. Excludes cancelled
                and suspended subscribers. It is the denominator for tickets per
                participant, churn rate and afdracht per participant, and is the
                core customer-base measure watched by the CRM team. Sensitive to
                seasonal acquisition campaigns and collection failures that
                trigger deactivation.
              synonyms:
                - deelnemers
                - active subscribers
              unit: count
              status: Implemented
              period: Monthly
              businessOwner: CRM & Participant Team
              implementationOwner: null
              source: CRM_SHARED
              release: null
              formula: null
              slices:
                - CHANNEL
                - LOTTERY_BRAND
                - MONTH
                - PARTICIPANT_BK
                - PROVINCE
              excludedSlices: []
              upstreamMetrics: []
              downstreamMetrics:
                - afdracht_per_participant
                - churn_rate
                - tickets_per_participant
              impactedMetrics: []
              impactingMetrics: []
              tags:
                - participation
          description: Distinct subscribers holding at least one active recurring lot in
            the period, across both brands and all acquisition channels.
            Deduplicated on participant, so a person holding multiple lots or
            both brands counts once per brand grain. Excludes cancelled and
            suspended subscribers. It is the denominator for tickets per
            participant, churn rate and afdracht per participant, and is the
            core customer-base measure watched by the CRM team. Sensitive to
            seasonal acquisition campaigns and collection failures that trigger
            deactivation.
          ai_context: deelnemers; active subscribers
        - name: cancellations
          expression: ""
          custom_extensions:
            duodata:
              name: Cancellations (Opzeggingen)
              identifier: cancellations
              description: Count of subscribers who cancelled all their active lots in the
                period, ending their participation with a brand. Includes
                voluntary opzeggingen and involuntary terminations after
                repeated collection failure; excludes temporary payment retries
                still in progress. It combines with new participants to give net
                growth and with the active base to give churn rate. Sensitive to
                price increases, prize-perception, and direct-debit reliability.
                A key retention signal for the CRM & Participant Team.
              synonyms:
                - opzeggingen
                - churned subscribers
              unit: count
              status: Implemented
              period: Monthly
              businessOwner: CRM & Participant Team
              implementationOwner: null
              source: CRM_SHARED
              release: null
              formula: null
              slices:
                - CHANNEL
                - LOTTERY_BRAND
                - MONTH
                - PARTICIPANT_BK
              excludedSlices: []
              upstreamMetrics: []
              downstreamMetrics:
                - churn_rate
                - net_participant_growth
              impactedMetrics: []
              impactingMetrics: []
              tags:
                - retention
          description: Count of subscribers who cancelled all their active lots in the
            period, ending their participation with a brand. Includes voluntary
            opzeggingen and involuntary terminations after repeated collection
            failure; excludes temporary payment retries still in progress. It
            combines with new participants to give net growth and with the
            active base to give churn rate. Sensitive to price increases,
            prize-perception, and direct-debit reliability. A key retention
            signal for the CRM & Participant Team.
          ai_context: opzeggingen; churned subscribers
        - name: new_participants
          expression: ""
          custom_extensions:
            duodata:
              name: New Participants (Acquisitions)
              identifier: new_participants
              description: Count of newly acquired subscribers who started at least one
                recurring lot in the period, attributed to campaign, channel and
                acquisition cohort. Includes reactivations only where a fresh
                subscription is created; excludes existing subscribers adding
                extra lots. It feeds net participant growth and is the volume
                base for CAC per ticket. Highly sensitive to campaign spend,
                door-to-door and media activity, and to product-tier promotions.
                A core input to the participant growth model.
              synonyms:
                - acquisitions
              unit: count
              status: Implemented
              period: Monthly
              businessOwner: CRM & Participant Team
              implementationOwner: null
              source: CRM_SHARED
              release: null
              formula: null
              slices:
                - CAMPAIGN_BK
                - CHANNEL
                - COHORT
                - MONTH
                - PARTICIPANT_BK
              excludedSlices: []
              upstreamMetrics: []
              downstreamMetrics:
                - cac_per_ticket
                - net_participant_growth
              impactedMetrics: []
              impactingMetrics: []
              tags:
                - growth
          description: Count of newly acquired subscribers who started at least one
            recurring lot in the period, attributed to campaign, channel and
            acquisition cohort. Includes reactivations only where a fresh
            subscription is created; excludes existing subscribers adding extra
            lots. It feeds net participant growth and is the volume base for CAC
            per ticket. Highly sensitive to campaign spend, door-to-door and
            media activity, and to product-tier promotions. A core input to the
            participant growth model.
          ai_context: acquisitions
        - name: vip_kaart_redemptions
          expression: ""
          custom_extensions:
            duodata:
              name: VIP-KAART Redemptions
              identifier: vip_kaart_redemptions
              description: Count of VIP-KAART visits redeemed by VriendenLoterij participants,
                granting free or discounted access to partnered cultural and
                leisure venues. Segmented by visit and participant. Excludes
                issued-but-unused cards. It is an engagement and
                value-perception indicator specific to VriendenLoterij,
                complementing prize value in explaining retention. Sensitive to
                venue partnerships, seasonality and communication campaigns
                encouraging redemption.
              synonyms:
                - VIP visits
              unit: count
              status: Implemented
              period: Monthly
              businessOwner: CRM & Participant Team
              implementationOwner: null
              source: CRM_SHARED
              release: null
              formula: null
              slices:
                - MONTH
                - PARTICIPANT_BK
                - VIPVISIT_BK
              excludedSlices: []
              upstreamMetrics: []
              downstreamMetrics: []
              impactedMetrics: []
              impactingMetrics: []
              tags:
                - engagement
                - VriendenLoterij
          description: Count of VIP-KAART visits redeemed by VriendenLoterij participants,
            granting free or discounted access to partnered cultural and leisure
            venues. Segmented by visit and participant. Excludes
            issued-but-unused cards. It is an engagement and value-perception
            indicator specific to VriendenLoterij, complementing prize value in
            explaining retention. Sensitive to venue partnerships, seasonality
            and communication campaigns encouraging redemption.
          ai_context: VIP visits
      custom_extensions:
        duodata:
          source:
            name: Shared CRM Platform
            identifier: CRM_SHARED
            description: Cross-brand customer relationship system holding subscriber,
              ticket, campaign and channel records for both Nationale Postcode
              Loterij and VriendenLoterij. System of record for participant
              identity, acquisition and churn events.
            synonyms:
              - CRM
              - Subscriber System
            type: operational-system
            tags:
              - Cross-Brand
              - Participant-Growth
    - name: DIM_BENEFICIARY
      description: "FCT_AFDRACHT with DIM_BENEFICIARY: allocation records linking
        transferred proceeds to good causes, including ANBI registration,
        beneficiary type, theme and (for VL) player-designated amounts."
      fields:
        - name: ALLOCATION_BK
          custom_extensions:
            duodata:
              name: Charity Allocation
              identifier: ALLOCATION_BK
              description: Grain of a single afdracht allocation transferring proceeds to a
                beneficiary in a licence year, including player-designated (VL
                player-choice) attribution where applicable.
              synonyms:
                - Afdracht Allocation
                - Proceeds Transfer
              status: Proposed
              businessOwner: null
              implementationOwner: null
              source: DIM_BENEFICIARY
              release: null
              values: null
              rollsUpTo:
                - ALLOCATION_THEME
                - BENEFICIARY_BK
                - LOTTERY_BRAND
                - YEAR
              tags:
                - Afdracht-Floor
                - Toekenningenraad
          description: Grain of a single afdracht allocation transferring proceeds to a
            beneficiary in a licence year, including player-designated (VL
            player-choice) attribution where applicable.
          ai_context: Afdracht Allocation; Proceeds Transfer
        - name: BENEFICIARY_BK
          custom_extensions:
            duodata:
              name: Beneficiary
              identifier: BENEFICIARY_BK
              description: Grain of a good cause receiving funds (multi-year partner, one-off
                grant, Droomfonds, cultural partner or club/association),
                qualified by ANBI status and allocation theme.
              synonyms:
                - Good Cause
                - Partner
                - Goed Doel
              status: Proposed
              businessOwner: null
              implementationOwner: null
              source: DIM_BENEFICIARY
              release: null
              values: null
              rollsUpTo:
                - ALLOCATION_THEME
                - ANBI_STATUS
                - BENEFICIARY_TYPE
                - LOTTERY_BRAND
              tags:
                - ANBI-Compliance
                - CBF-Erkend
                - Toekenningenraad
          description: Grain of a good cause receiving funds (multi-year partner, one-off
            grant, Droomfonds, cultural partner or club/association), qualified
            by ANBI status and allocation theme.
          ai_context: Good Cause; Partner; Goed Doel
      metrics:
        - name: afdracht
          expression: ""
          custom_extensions:
            duodata:
              name: Afdracht to Good Causes
              identifier: afdracht
              description: Total funds transferred to good causes from lottery proceeds, the
                north-star metric of the charity subscription lottery. Measured
                per beneficiary, allocation and theme; includes both freely
                allocated and player-designated amounts. Excludes prize payouts,
                gaming tax and organisation costs, which sit alongside afdracht
                rather than being netted through it. By licence at least 40% of
                gross inleg must become afdracht each calendar year. It drives
                afdracht percentage, ANBI share and afdracht per participant,
                and is the group's core purpose measure.
              synonyms:
                - charity contribution
                - proceeds to beneficiaries
              unit: EUR
              status: Implemented
              period: Annual
              businessOwner: Charities & Beneficiary Allocation Team (Toekenningenraad
                support)
              implementationOwner: null
              source: DIM_BENEFICIARY
              release: null
              formula: null
              slices:
                - ALLOCATION_BK
                - ALLOCATION_THEME
                - BENEFICIARY_BK
                - LOTTERY_BRAND
                - YEAR
              excludedSlices: []
              upstreamMetrics: []
              downstreamMetrics:
                - afdracht_headroom
                - afdracht_pct
                - afdracht_per_participant
                - anbi_share
                - net_result
              impactedMetrics: []
              impactingMetrics:
                - metric: player_designated_afdracht
                  reason: Player-designated amounts are a component of the total afdracht to good
                    causes.
              tags:
                - licence
                - northstar
          description: Total funds transferred to good causes from lottery proceeds, the
            north-star metric of the charity subscription lottery. Measured per
            beneficiary, allocation and theme; includes both freely allocated
            and player-designated amounts. Excludes prize payouts, gaming tax
            and organisation costs, which sit alongside afdracht rather than
            being netted through it. By licence at least 40% of gross inleg must
            become afdracht each calendar year. It drives afdracht percentage,
            ANBI share and afdracht per participant, and is the group's core
            purpose measure.
          ai_context: charity contribution; proceeds to beneficiaries
        - name: afdracht_pct
          expression: afdracht / gross_inleg
          custom_extensions:
            duodata:
              name: Afdracht Percentage
              identifier: afdracht_pct
              description: Ratio of afdracht to gross inleg, the licence-critical contribution
                rate that must be at least 40% per calendar year for a charity
                lottery. This is the headline measure of how much of every euro
                staked reaches good causes; 2024 combined was roughly 42%.
                Excludes prize and cost effects except through their impact on
                the numerator and denominator. Highly sensitive to inleg growth
                outpacing allocation timing and to special-year effects. It is
                the single most scrutinised KSA compliance figure.
              synonyms:
                - contribution rate
                - payout-to-charity %
              unit: "%"
              status: Implemented
              period: Calendar Year (Licence)
              businessOwner: Charities & Beneficiary Allocation Team (Toekenningenraad
                support)
              implementationOwner: null
              source: DIM_BENEFICIARY
              release: null
              formula:
                pretty: afdracht / gross_inleg
                variables:
                  - afdracht
                  - gross_inleg
                expressionAst:
                  type: root
                  value: ""
                  children:
                    - type: metric
                      value: afdracht
                    - type: operator
                      value: /
                    - type: metric
                      value: gross_inleg
              slices:
                - LOTTERY_BRAND
                - YEAR
              excludedSlices: []
              upstreamMetrics:
                - afdracht
                - gross_inleg
              downstreamMetrics: []
              impactedMetrics: []
              impactingMetrics: []
              tags:
                - kpi
                - licence
          description: Ratio of afdracht to gross inleg, the licence-critical contribution
            rate that must be at least 40% per calendar year for a charity
            lottery. This is the headline measure of how much of every euro
            staked reaches good causes; 2024 combined was roughly 42%. Excludes
            prize and cost effects except through their impact on the numerator
            and denominator. Highly sensitive to inleg growth outpacing
            allocation timing and to special-year effects. It is the single most
            scrutinised KSA compliance figure.
          ai_context: contribution rate; payout-to-charity %
        - name: anbi_afdracht
          expression: ""
          custom_extensions:
            duodata:
              name: ANBI-Directed Afdracht
              identifier: anbi_afdracht
              description: Portion of afdracht transferred to beneficiaries holding ANBI
                (public benefit organisation) registration. Segmented by
                beneficiary and ANBI status. At least 80% of total afdracht must
                flow to ANBI-registered bodies under the charity-lottery
                licence, so this metric is the numerator for the ANBI share
                compliance ratio. Excludes allocations to non-ANBI partners and
                internal programme costs. Sensitive to changes in the
                beneficiary portfolio and to any beneficiary losing or gaining
                ANBI status during the year.
              synonyms:
                - ANBI afdracht
              unit: EUR
              status: Implemented
              period: Annual
              businessOwner: Charities & Beneficiary Allocation Team (Toekenningenraad
                support)
              implementationOwner: null
              source: DIM_BENEFICIARY
              release: null
              formula: null
              slices:
                - ANBI_STATUS
                - BENEFICIARY_BK
                - YEAR
              excludedSlices: []
              upstreamMetrics: []
              downstreamMetrics:
                - anbi_share
              impactedMetrics: []
              impactingMetrics: []
              tags:
                - licence
          description: Portion of afdracht transferred to beneficiaries holding ANBI
            (public benefit organisation) registration. Segmented by beneficiary
            and ANBI status. At least 80% of total afdracht must flow to
            ANBI-registered bodies under the charity-lottery licence, so this
            metric is the numerator for the ANBI share compliance ratio.
            Excludes allocations to non-ANBI partners and internal programme
            costs. Sensitive to changes in the beneficiary portfolio and to any
            beneficiary losing or gaining ANBI status during the year.
          ai_context: ANBI afdracht
        - name: anbi_share
          expression: anbi_afdracht / afdracht
          custom_extensions:
            duodata:
              name: ANBI Share of Afdracht
              identifier: anbi_share
              description: Share of total afdracht directed to ANBI-registered beneficiaries,
                computed as ANBI-directed afdracht divided by total afdracht.
                Licence rules require at least 80%. It confirms that lottery
                proceeds predominantly reach recognised public-benefit
                organisations. Sensitive to the beneficiary portfolio
                composition and any status changes during the year. Reported to
                the KSA alongside the afdracht percentage.
              synonyms:
                - ANBI %
              unit: "%"
              status: Implemented
              period: Calendar Year (Licence)
              businessOwner: Charities & Beneficiary Allocation Team (Toekenningenraad
                support)
              implementationOwner: null
              source: DIM_BENEFICIARY
              release: null
              formula:
                pretty: anbi_afdracht / afdracht
                variables:
                  - anbi_afdracht
                  - afdracht
                expressionAst:
                  type: root
                  value: ""
                  children:
                    - type: metric
                      value: anbi_afdracht
                    - type: operator
                      value: /
                    - type: metric
                      value: afdracht
              slices:
                - ANBI_STATUS
                - YEAR
              excludedSlices: []
              upstreamMetrics:
                - afdracht
                - anbi_afdracht
              downstreamMetrics: []
              impactedMetrics: []
              impactingMetrics: []
              tags:
                - kpi
                - licence
          description: Share of total afdracht directed to ANBI-registered beneficiaries,
            computed as ANBI-directed afdracht divided by total afdracht.
            Licence rules require at least 80%. It confirms that lottery
            proceeds predominantly reach recognised public-benefit
            organisations. Sensitive to the beneficiary portfolio composition
            and any status changes during the year. Reported to the KSA
            alongside the afdracht percentage.
          ai_context: ANBI %
        - name: partners_funded
          expression: ""
          custom_extensions:
            duodata:
              name: Beneficiary Partners Funded
              identifier: partners_funded
              description: Count of distinct good-cause organisations receiving funds in the
                allocation year, segmented by beneficiary type and allocation
                theme. Includes structural partners and project grants; excludes
                prospective partners not yet awarded. It measures the breadth of
                societal impact alongside the monetary afdracht and supports the
                Toekenningenraad allocation narrative. Sensitive to portfolio
                decisions to concentrate or broaden funding and to ANBI
                eligibility of new partners.
              synonyms:
                - good causes supported
              unit: count
              status: Implemented
              period: Annual
              businessOwner: Charities & Beneficiary Allocation Team (Toekenningenraad
                support)
              implementationOwner: null
              source: DIM_BENEFICIARY
              release: null
              formula: null
              slices:
                - ALLOCATION_THEME
                - BENEFICIARY_BK
                - BENEFICIARY_TYPE
                - YEAR
              excludedSlices: []
              upstreamMetrics: []
              downstreamMetrics: []
              impactedMetrics: []
              impactingMetrics: []
              tags:
                - impact
          description: Count of distinct good-cause organisations receiving funds in the
            allocation year, segmented by beneficiary type and allocation theme.
            Includes structural partners and project grants; excludes
            prospective partners not yet awarded. It measures the breadth of
            societal impact alongside the monetary afdracht and supports the
            Toekenningenraad allocation narrative. Sensitive to portfolio
            decisions to concentrate or broaden funding and to ANBI eligibility
            of new partners.
          ai_context: good causes supported
        - name: player_designated_afdracht
          expression: ""
          custom_extensions:
            duodata:
              name: Player-Designated Afdracht
              identifier: player_designated_afdracht
              description: Portion of VriendenLoterij afdracht steered to the beneficiary
                personally chosen by each participant (player-choice mechanic).
                Segmented by beneficiary, allocation and participant. Included
                within total afdracht but tracked separately to show
                participant-directed impact. Excludes freely allocated proceeds
                decided by the Toekenningenraad. Sensitive to participant
                designation behaviour and to which partner clubs and causes are
                promoted, and it distinguishes VriendenLoterij's model from
                Nationale Postcode Loterij.
              synonyms:
                - player-choice afdracht
              unit: EUR
              status: Implemented
              period: Annual
              businessOwner: Charities & Beneficiary Allocation Team (Toekenningenraad
                support)
              implementationOwner: null
              source: DIM_BENEFICIARY
              release: null
              formula: null
              slices:
                - ALLOCATION_BK
                - BENEFICIARY_BK
                - PARTICIPANT_BK
                - YEAR
              excludedSlices: []
              upstreamMetrics: []
              downstreamMetrics: []
              impactedMetrics:
                - metric: afdracht
                  reason: Player-designated amounts are a component of the total afdracht to good
                    causes.
              impactingMetrics: []
              tags:
                - afdracht
                - VriendenLoterij
          description: Portion of VriendenLoterij afdracht steered to the beneficiary
            personally chosen by each participant (player-choice mechanic).
            Segmented by beneficiary, allocation and participant. Included
            within total afdracht but tracked separately to show
            participant-directed impact. Excludes freely allocated proceeds
            decided by the Toekenningenraad. Sensitive to participant
            designation behaviour and to which partner clubs and causes are
            promoted, and it distinguishes VriendenLoterij's model from
            Nationale Postcode Loterij.
          ai_context: player-choice afdracht
      custom_extensions:
        duodata:
          source:
            name: Beneficiary & Afdracht Store
            identifier: DIM_BENEFICIARY
            description: "FCT_AFDRACHT with DIM_BENEFICIARY: allocation records linking
              transferred proceeds to good causes, including ANBI registration,
              beneficiary type, theme and (for VL) player-designated amounts."
            synonyms:
              - Afdracht Store
              - Beneficiary Dimension
            type: data-warehouse
            tags:
              - ANBI-Compliance
              - CBF-Erkend
              - Toekenningenraad
    - name: DRAW_PRIZE_ENGINE
      description: System executing draws and allocating prizes, including
        postcode/street/neighbourhood win logic and per-draw prize computation.
        Source of draw events, prize values and gaming-tax base.
      fields:
        - name: DRAW_BK
          custom_extensions:
            duodata:
              name: Draw
              identifier: DRAW_BK
              description: Grain of an individual lottery draw event (monthly, extra and
                seasonal draws plus weekly street/bingo draws) for a given
                brand. Time anchor for prize allocation and per-draw ticket
                stock.
              synonyms:
                - Trekking
                - Draw Event
              status: Proposed
              businessOwner: null
              implementationOwner: null
              source: DRAW_PRIZE_ENGINE
              release: null
              values: null
              rollsUpTo:
                - DAY
                - DRAW_TYPE
                - LOTTERY_BRAND
              tags:
                - Prize-Economics
          description: Grain of an individual lottery draw event (monthly, extra and
            seasonal draws plus weekly street/bingo draws) for a given brand.
            Time anchor for prize allocation and per-draw ticket stock.
          ai_context: Trekking; Draw Event
        - name: PRIZE_BK
          custom_extensions:
            duodata:
              name: Prize
              identifier: PRIZE_BK
              description: Grain of an individual prize awarded within a draw, carrying gross
                prize value, net prize cost after in-kind supplier discounts,
                and the gaming-tax base for prizes above €449.
              synonyms:
                - Prijs
                - Prijzengeld
              status: Proposed
              businessOwner: null
              implementationOwner: null
              source: DRAW_PRIZE_ENGINE
              release: null
              values: null
              rollsUpTo:
                - DRAW_BK
                - LOTTERY_BRAND
                - POSTCODE
              tags:
                - KSA-Licence
                - Prize-Economics
          description: Grain of an individual prize awarded within a draw, carrying gross
            prize value, net prize cost after in-kind supplier discounts, and
            the gaming-tax base for prizes above €449.
          ai_context: Prijs; Prijzengeld
      metrics:
        - name: draws_held
          expression: ""
          custom_extensions:
            duodata:
              name: Draws Held
              identifier: draws_held
              description: Count of lottery draws conducted in the period across both brands,
                segmented by draw type (regular monthly, special, jackpot) and
                brand. Excludes cancelled or rescheduled draws. It
                contextualises prize value and participation, and is an
                operational throughput measure for the Lottery Operations & Draw
                Team. Sensitive to the draw calendar and special-event
