      reports:
        - name: Charity Allocation & Beneficiary Impact Report
          identifier: charity_allocation_impact
          description: >-
            Prepared for the Toekenningenraad support team and the Charities &
            Beneficiary Allocation Team to steer annual allocation decisions
            across themes and beneficiary types. It shows total afdracht, ANBI
            share, the number of partners funded, player-designated afdracht at
            VriendenLoterij, per-participant impact and compliance headroom.


            Audience is the allocation committee and board; cadence is annual
            around the allocation cycle. Decisions include portfolio breadth
            versus concentration, structural-partner renewals and communicating
            participant impact.
          synonyms:
            - beneficiary report
          questions:
            - How is afdracht distributed across allocation themes and
              beneficiary types?
            - How many good-cause partners were funded this year?
            - What share of VriendenLoterij afdracht was player-designated?
            - How much good-cause funding did the average participant enable?
          status: Proposed
          refreshPeriod: Annual
          businessOwner: null
          implementationOwner: null
          release: null
          metrics:
            - afdracht
            - afdracht_headroom
            - afdracht_per_participant
            - anbi_share
            - partners_funded
            - player_designated_afdracht
          slices:
            - ALLOCATION_THEME
            - BENEFICIARY_TYPE
            - LOTTERY_BRAND
            - YEAR
          tags:
            - allocation
            - impact
        - name: Collections & Participant Engagement Report
          identifier: collections_engagement
          description: >-
            Operational report for the Finance and CRM teams monitoring
            recurring direct-debit performance and VriendenLoterij VIP-KAART
            engagement against the active base. It presents successful and
            attempted collections, the collection success rate and VIP-KAART
            redemptions.


            Reviewed frequently to detect incasso deterioration that erodes
            realised inleg and drives involuntary churn, and to gauge engagement
            value. Decisions include mandate-repair campaigns, dunning strategy
            and VIP venue partnerships.
          synonyms:
            - incasso report
          questions:
            - What is the current direct-debit collection success rate?
            - How many collection attempts failed and why?
            - Are VIP-KAART redemptions growing among active participants?
            - Is collection failure a leading indicator of churn?
          status: Proposed
          refreshPeriod: Weekly
          businessOwner: null
          implementationOwner: null
          release: null
          metrics:
            - active_participants
            - attempted_collections
            - collection_success_rate
            - successful_collections
            - vip_kaart_redemptions
          slices:
            - CHANNEL
            - MONTH
            - PAYMENT_STATUS
          tags:
            - collections
            - engagement
        - name: Draw, Prize & Product Mix Report
          identifier: draw_prize_product_mix
          description: >-
            Operations report for the Lottery Operations & Draw Team covering
            draw throughput, prize economics and product-tier mix. It presents
            draws held, gross and net prize value, in-kind discounts, payout
            ratio, Plus/Premium volumes and mix, average lot price and tickets
            in play.


            Reviewed monthly to balance prize attractiveness against the
            afdracht objective and to plan special draws and upsell. Decisions
            include jackpot sizing, supplier deals and tier promotion timing.
          synonyms:
            - operations report
          questions:
            - What is the prize payout ratio by draw type and brand?
            - How much prize cost is offset by in-kind supplier discounts?
