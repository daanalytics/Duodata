metricImplementations:
  - metric: household_overlap
    platform: sf-postcodeloterij
    name: household_overlap
    physicalId: POSTCODELOTERIJ.SAMPLE_SCHEMA.DIM_PARTICIPANT.HOUSEHOLD_ID
    description: null
    deepLink: null
    schemaObjectRef:
      database: POSTCODELOTERIJ
      schema: SAMPLE_SCHEMA
      table: DIM_PARTICIPANT
      column: HOUSEHOLD_ID
    technicalRule: COUNT_IF(hh_brands = 2) FROM (SELECT HOUSEHOLD_ID, COUNT(DISTINCT LOTTERY_CODE) hh_brands
      FROM DIM_PARTICIPANT GROUP BY 1)
