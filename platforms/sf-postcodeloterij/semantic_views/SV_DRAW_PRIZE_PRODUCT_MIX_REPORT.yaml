name: SV_DRAW_PRIZE_PRODUCT_MIX_REPORT
description: >-
  Operations report for the Lottery Operations & Draw Team covering draw
  throughput, prize economics and product-tier mix. It presents draws held,
  gross and net prize value, in-kind discounts, payout ratio, Plus/Premium
  volumes and mix, average lot price and tickets in play.


  Reviewed monthly to balance prize attractiveness against the afdracht
  objective and to plan special draws and upsell. Decisions include jackpot
  sizing, supplier deals and tier promotion timing.
tables:
  - name: DRAW_TYPE
    description: Official lottery draw. Extra draws sit besides monthly draws.
    base_table:
      database: POSTCODELOTERIJ
      schema: SAMPLE_SCHEMA
      table: DIM_DRAW
    primary_key:
      columns:
        - DRAW_KEY
    synonyms:
      - Draw Cadence
    dimensions:
      - name: DRAW_KEY
        description: Draw surrogate key. Unqualified; do not use database.schema.table.column.
        expr: DRAW_KEY
        data_type: NUMBER
      - name: DRAW_TYPE
        synonyms:
          - Draw Cadence
        description: monthly or extra
        expr: DRAW_TYPE
        data_type: VARCHAR
        is_enum: true
      - name: DRAW_NAME
        description: Public draw name
        expr: DRAW_NAME
        data_type: VARCHAR
      - name: LOTTERY_CODE
        description: NPL or VL on the draw
        expr: LOTTERY_CODE
        data_type: VARCHAR
    time_dimensions:
      - name: DRAW_DATE
        description: Draw date, typically month-end
        expr: DRAW_DATE
        data_type: DATE
  - name: LOTTERY_BRAND
    description: Dimension distinguishing the two licensed lottery brands.
    base_table:
      database: POSTCODELOTERIJ
      schema: SAMPLE_SCHEMA
      table: DIM_LOTTERY
    primary_key:
      columns:
        - LOTTERY_KEY
    synonyms:
      - Brand
      - Licensed Lottery
    dimensions:
      - name: LOTTERY_KEY
        description: Lottery surrogate key
        expr: LOTTERY_KEY
        data_type: NUMBER
      - name: LOTTERY_BRAND
        synonyms:
          - Brand
          - Licensed Lottery
        description: Public brand name
        expr: LOTTERY_NAME
        data_type: VARCHAR
        is_enum: true
      - name: LOTTERY_CODE
        description: NPL or VL
        expr: LOTTERY_CODE
        data_type: VARCHAR
  - name: MONTH
    description: Calendar date dimension. Grain of monthly money-split and draw date.
    base_table:
      database: POSTCODELOTERIJ
      schema: SAMPLE_SCHEMA
      table: DIM_DATE
    primary_key:
      columns:
        - DATE_KEY
    synonyms:
      - Calendar Month
    dimensions:
      - name: DATE_KEY
        description: Surrogate date key YYYYMMDD
        expr: DATE_KEY
        data_type: NUMBER
      - name: MONTH_NAME
        description: English month name
        expr: MONTH_NAME
        data_type: VARCHAR
    time_dimensions:
      - name: MONTH
        synonyms:
          - Calendar Month
        description: Calendar month
        expr: DATE_TRUNC('MONTH', FULL_DATE)
        data_type: DATE
      - name: YEAR
        description: Calendar year
        expr: DATE_TRUNC('YEAR', FULL_DATE)
        data_type: DATE
      - name: QUARTER
        description: Calendar quarter
        expr: DATE_TRUNC('QUARTER', FULL_DATE)
        data_type: DATE
  - name: PRODUCT_TIER
    description: Priced lot variant (Standard / Plus / Premium).
    base_table:
      database: POSTCODELOTERIJ
      schema: SAMPLE_SCHEMA
      table: DIM_PRODUCT
    primary_key:
      columns:
        - PRODUCT_KEY
    synonyms:
      - Product
      - Lot Tier
      - Price Mix
    dimensions:
      - name: PRODUCT_KEY
        description: Product surrogate key
        expr: PRODUCT_KEY
        data_type: NUMBER
      - name: PRODUCT_TIER
        synonyms:
          - Product
          - Lot Tier
          - Price Mix
        description: Product name (Standard, Plus, Premium)
        expr: PRODUCT_NAME
        data_type: VARCHAR
        is_enum: true
      - name: IS_UPGRADE
        description: True for Plus and Premium
        expr: IS_UPGRADE
        data_type: BOOLEAN
  - name: FCT_TICKET_DRAW
    description: >-
      One ticket billed in one draw. Use for tickets in play, average lot price
      and Plus/Premium mix. Do not add INLEG_EUR to FCT_FINANCE_MONTH.
    base_table:
      database: POSTCODELOTERIJ
      schema: SAMPLE_SCHEMA
      table: FCT_TICKET_DRAW
    primary_key:
      columns:
        - TICKET_DRAW_KEY
    facts:
      - name: TICKET_DRAW_KEY
        description: Ticket-draw surrogate key
        expr: TICKET_DRAW_KEY
        data_type: NUMBER
      - name: TICKET_PRICE_EUR
        description: Price billed for this ticket in this draw
        expr: TICKET_PRICE_EUR
        data_type: NUMBER
      - name: INLEG_EUR
        description: Ticket sales amount. Equals ticket price when billed.
        expr: INLEG_EUR
        data_type: NUMBER
      - name: COLLECTION_EUR
        description: Amount actually collected by direct debit
        expr: COLLECTION_EUR
        data_type: NUMBER
      - name: IS_COLLECTED
        description: True when direct debit succeeded
        expr: IS_COLLECTED
        data_type: BOOLEAN
      - name: IS_NEW_TICKET
        description: True on the first draw this ticket is billed
        expr: IS_NEW_TICKET
        data_type: BOOLEAN
      - name: TICKET_COUNT
        description: One per billed ticket-draw row. SUM is tickets in play.
        expr: 1
        data_type: NUMBER
      - name: IS_UPGRADE
        description: 1 when the ticket is Plus or Premium (from DIM_PRODUCT).
        expr: IFF((SELECT p.IS_UPGRADE FROM POSTCODELOTERIJ.SAMPLE_SCHEMA.DIM_PRODUCT p WHERE p.PRODUCT_KEY = PRODUCT_KEY), 1, 0)
        data_type: NUMBER
      - name: PLUS_PREMIUM_TICKETS
        description: Alias of IS_UPGRADE so plus_premium_mix can SUM(PLUS_PREMIUM_TICKETS).
        expr: IFF((SELECT p.IS_UPGRADE FROM POSTCODELOTERIJ.SAMPLE_SCHEMA.DIM_PRODUCT p WHERE p.PRODUCT_KEY = PRODUCT_KEY), 1, 0)
        data_type: NUMBER
      - name: TICKETS_IN_PLAY
        description: One per billed ticket-draw row. SUM is tickets in play.
        expr: 1
        data_type: NUMBER
    metrics:
      - name: PLUS_PREMIUM_MIX
        description: Plus/Premium tickets as a share of tickets in play
        expr: DIV0NULL(SUM(PLUS_PREMIUM_TICKETS), SUM(TICKETS_IN_PLAY))
  - name: FCT_PRIZE
    description: >-
      One prize awarded to one participant. GROSS is consumer-facing value; NET
      is P&L cost after in-kind supplier discounts.
    base_table:
      database: POSTCODELOTERIJ
      schema: SAMPLE_SCHEMA
      table: FCT_PRIZE
    primary_key:
      columns:
        - PRIZE_KEY
    facts:
      - name: PRIZE_KEY
        description: Prize surrogate key
        expr: PRIZE_KEY
        data_type: NUMBER
      - name: GROSS_PRIZE_VALUE_EUR
        description: Consumer-facing prize value
        expr: GROSS_PRIZE_VALUE_EUR
        data_type: NUMBER
      - name: NET_PRIZE_COST_EUR
        description: P&L prize cost after in-kind supplier discounts
        expr: NET_PRIZE_COST_EUR
        data_type: NUMBER
      - name: SUPPLIER_DISCOUNT_EUR
        description: Discount on in-kind prizes
        expr: SUPPLIER_DISCOUNT_EUR
        data_type: NUMBER
      - name: KANSSPELBELASTING_EUR
        description: Gaming tax paid by the lottery, not the player
        expr: KANSSPELBELASTING_EUR
        data_type: NUMBER
      - name: IS_IN_KIND
        description: True for natura prizes
        expr: IS_IN_KIND
        data_type: BOOLEAN
  - name: FCT_FINANCE_MONTH
    description: >-
      One lottery in one calendar month. Official money-split for payout ratio.
      Do not add INLEG_EUR to FCT_TICKET_DRAW.
    base_table:
      database: POSTCODELOTERIJ
      schema: SAMPLE_SCHEMA
      table: FCT_FINANCE_MONTH
    primary_key:
      columns:
        - FINANCE_KEY
    facts:
      - name: FINANCE_KEY
        description: Finance surrogate key. Use FINANCE_KEY, never POSTCODELOTERIJ.SAMPLE_SCHEMA.FCT_FINANCE_MONTH.FINANCE_KEY.
        expr: FINANCE_KEY
        data_type: NUMBER
      - name: INLEG_EUR
        description: Gross ticket sales for the month. Do not add to FCT_TICKET_DRAW.INLEG_EUR.
        expr: INLEG_EUR
        data_type: NUMBER
      - name: GROSS_PRIZE_VALUE_EUR
        description: Consumer-facing prize pot for the month
        expr: GROSS_PRIZE_VALUE_EUR
        data_type: NUMBER
      - name: NET_PRIZE_COST_EUR
        description: P&L prize cost after in-kind discounts
        expr: NET_PRIZE_COST_EUR
        data_type: NUMBER
      - name: GROSS_INLEG_EUR
        description: Alias of INLEG_EUR so prize_payout_ratio can divide two facts on this table.
        expr: INLEG_EUR
        data_type: NUMBER
      - name: GROSS_INLEG
        description: Alias of INLEG_EUR so prize_payout_ratio can SUM(GROSS_INLEG).
        expr: INLEG_EUR
        data_type: NUMBER
      - name: GROSS_PRIZE_VALUE
        description: Alias of GROSS_PRIZE_VALUE_EUR so prize_payout_ratio can SUM(GROSS_PRIZE_VALUE).
        expr: GROSS_PRIZE_VALUE_EUR
        data_type: NUMBER
    metrics:
      - name: PRIZE_PAYOUT_RATIO
        description: Gross prize pot as a share of official monthly inleg
        expr: DIV0NULL(SUM(GROSS_PRIZE_VALUE), SUM(GROSS_INLEG))
relationships:
  - name: TICKET_DRAW_TO_DRAW_TYPE
    left_table: FCT_TICKET_DRAW
    right_table: DRAW_TYPE
    relationship_columns:
      - left_column: DRAW_KEY
        right_column: DRAW_KEY
  - name: TICKET_DRAW_TO_MONTH
    left_table: FCT_TICKET_DRAW
    right_table: MONTH
    relationship_columns:
      - left_column: DATE_KEY
        right_column: DATE_KEY
  - name: TICKET_DRAW_TO_LOTTERY_BRAND
    left_table: FCT_TICKET_DRAW
    right_table: LOTTERY_BRAND
    relationship_columns:
      - left_column: LOTTERY_KEY
        right_column: LOTTERY_KEY
  - name: TICKET_DRAW_TO_PRODUCT_TIER
    left_table: FCT_TICKET_DRAW
    right_table: PRODUCT_TIER
    relationship_columns:
      - left_column: PRODUCT_KEY
        right_column: PRODUCT_KEY
  - name: PRIZE_TO_DRAW_TYPE
    left_table: FCT_PRIZE
    right_table: DRAW_TYPE
    relationship_columns:
      - left_column: DRAW_KEY
        right_column: DRAW_KEY
  - name: PRIZE_TO_MONTH
    left_table: FCT_PRIZE
    right_table: MONTH
    relationship_columns:
      - left_column: DATE_KEY
        right_column: DATE_KEY
  - name: PRIZE_TO_LOTTERY_BRAND
    left_table: FCT_PRIZE
    right_table: LOTTERY_BRAND
    relationship_columns:
      - left_column: LOTTERY_KEY
        right_column: LOTTERY_KEY
  - name: PRIZE_TO_PRODUCT_TIER
    left_table: FCT_PRIZE
    right_table: PRODUCT_TIER
    relationship_columns:
      - left_column: PRODUCT_KEY
        right_column: PRODUCT_KEY
  - name: FINANCE_MONTH_TO_MONTH
    left_table: FCT_FINANCE_MONTH
    right_table: MONTH
    relationship_columns:
      - left_column: DATE_KEY
        right_column: DATE_KEY
  - name: FINANCE_MONTH_TO_LOTTERY_BRAND
    left_table: FCT_FINANCE_MONTH
    right_table: LOTTERY_BRAND
    relationship_columns:
      - left_column: LOTTERY_KEY
        right_column: LOTTERY_KEY
