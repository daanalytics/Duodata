name: SV_DRAW_PRIZE_PRODUCT_MIX_REPORT
description: >-
  Operations report for the Lottery Operations & Draw Team covering draw
  throughput, prize economics and product-tier mix. It presents draws held,
  gross and net prize value, in-kind discounts, payout ratio, Plus/Premium
  volumes and mix, average lot price and tickets in play.


  Reviewed monthly to balance prize attractiveness against the afdracht
  objective and to plan special draws and upsell. Decisions include jackpot
  sizing, supplier deals and tier promotion timing.
tables:
  - name: DRAW_TYPE
    description: Dimension of the type/cadence of draw within a brand's annual draw
      calendar (14 draws/year for NPL, 15 for VL, plus weekly draws).
    base_table:
      database: POSTCODELOTERIJ
      schema: SAMPLE_SCHEMA
      table: DIM_DRAW
    primary_key:
      columns:
        - DRAW_KEY
    synonyms:
      - Draw Cadence
    dimensions:
      - name: DRAW_TYPE
        description: Dimension of the type/cadence of draw within a brand's annual draw
          calendar (14 draws/year for NPL, 15 for VL, plus weekly draws).
        expr: DRAW_TYPE
        data_type: VARCHAR
    facts:
      - name: DRAWS_HELD
        description: Count of lottery draws conducted in the period across both brands,
          segmented by draw type (regular monthly, special, jackpot) and brand.
          Excludes cancelled or rescheduled draws. It contextualises prize value
          and participation, and is an operational throughput measure for the
          Lottery Operations & Draw Team. Sensitive to the draw calendar and
          special-event scheduling such as the PostcodeKanjer.
        expr: DRAW_KEY
        data_type: NUMBER
  - name: FINANCE_MONTH
    description: Grain of one lottery in one calendar month. Official money-split
      for inleg, prizes and payout ratio. Primary key is FINANCE_KEY.
    base_table:
      database: POSTCODELOTERIJ
      schema: SAMPLE_SCHEMA
      table: FCT_FINANCE_MONTH
    primary_key:
      columns:
        - FINANCE_KEY
    synonyms:
      - Money split
      - Monthly finance
    dimensions:
      - name: FINANCE_MONTH
        description: Grain of one lottery in one calendar month. Official money-split
          for inleg, prizes and payout ratio. Primary key is FINANCE_KEY.
        expr: FINANCE_KEY
        data_type: NUMBER
    facts:
      - name: GROSS_PRIZE_VALUE_EUR
        description: Consumer-facing prize pot for the month
        expr: GROSS_PRIZE_VALUE_EUR
        data_type: NUMBER
      - name: INLEG_EUR
        description: Official monthly inleg. Do not add TICKET_DRAW_FACT inleg to this.
        expr: INLEG_EUR
        data_type: NUMBER
    metrics:
      - name: PRIZE_PAYOUT_RATIO
        description: Consumer-facing prize value as a share of gross inleg, computed as
          gross prize value divided by gross inleg. For a charity lottery this
          sits alongside the 40% afdracht floor rather than competing with it,
          and communicates winnable value to participants. Excludes supplier
          discounts and gaming tax. Sensitive to jackpot design and special
          draws. Watched by operations to balance attractiveness against the
          afdracht objective.
        expr: DIV0NULL(SUM(GROSS_PRIZE_VALUE_EUR), SUM(INLEG_EUR))
  - name: LOTTERY_BRAND
    description: Dimension distinguishing the two licensed lottery brands operated
      by the single operating company; each holds its own KSA article-3 licence.
    base_table:
      database: POSTCODELOTERIJ
      schema: SAMPLE_SCHEMA
      table: DIM_LOTTERY
    primary_key:
      columns:
        - LOTTERY_KEY
    synonyms:
      - Brand
      - Licensed Lottery
    dimensions:
      - name: LOTTERY_BRAND
        description: Dimension distinguishing the two licensed lottery brands operated
          by the single operating company; each holds its own KSA article-3
          licence.
        expr: LOTTERY_NAME
        data_type: VARCHAR
  - name: MONTH
    description: Calendar month time level aggregating days; grain of the
      FCT_FINANCE_MONTH money split.
    base_table:
      database: POSTCODELOTERIJ
      schema: SAMPLE_SCHEMA
      table: DIM_DATE
    primary_key:
      columns:
        - DATE_KEY
    synonyms:
      - Calendar Month
    time_dimensions:
      - name: MONTH
        description: Calendar month time level aggregating days; grain of the
          FCT_FINANCE_MONTH money split.
        expr: DATE_TRUNC('MONTH', FULL_DATE)
        data_type: DATE
  - name: PRIZE_FACT
    description: Grain of one prize awarded to one participant. Primary key is PRIZE_KEY.
    base_table:
      database: POSTCODELOTERIJ
      schema: SAMPLE_SCHEMA
      table: FCT_PRIZE
    primary_key:
      columns:
        - PRIZE_KEY
    synonyms:
      - Prize award
    dimensions:
      - name: PRIZE_FACT
        description: Grain of one prize awarded to one participant. Primary key is
          PRIZE_KEY.
        expr: PRIZE_KEY
        data_type: NUMBER
    facts:
      - name: IN_KIND_SUPPLIER_DISCOUNT_ON_PRIZES
        description: Value of discounts, sponsorships and in-kind supply that reduce the
          actual cash cost of prizes below their consumer-facing gross value
          (e.g. cars, holidays or goods provided below retail). Segmented by
          prize and draw. This is subtracted from gross prize value to derive
          net prize cost, the amount actually borne by the lottery. Excludes
          gaming tax. Sensitive to supplier negotiations and the mix of physical
          versus cash prizes in each draw.
        expr: SUPPLIER_DISCOUNT_EUR
        data_type: NUMBER
      - name: GROSS_PRIZE_VALUE_EUR
        description: GROSS_PRIZE_VALUE_EUR
        expr: GROSS_PRIZE_VALUE_EUR
        data_type: NUMBER
      - name: SUPPLIER_DISCOUNT_EUR
        description: Discount on in-kind prizes
        expr: SUPPLIER_DISCOUNT_EUR
        data_type: NUMBER
    metrics:
      - name: NET_PRIZE_COST
        description: Actual cost of prizes borne by the lottery, computed as gross prize
          value minus in-kind supplier discounts. It reflects real cash and
          goods outflow after sponsorships, and feeds the statutory net result.
          Excludes gaming tax, which is tracked separately. Sensitive to the
          proportion of in-kind versus cash prizes and to supplier deal quality.
          Distinct from the consumer-facing gross prize value used for
          perception and payout ratio.
        expr: SUM(GROSS_PRIZE_VALUE_EUR - SUPPLIER_DISCOUNT_EUR)
  - name: PRODUCT_TIER
    description: Dimension for the priced lot variant a subscription holds, driving
      the price component of the inleg identity and Plus/Premium mix.
    base_table:
      database: POSTCODELOTERIJ
      schema: SAMPLE_SCHEMA
      table: DIM_PRODUCT
    primary_key:
      columns:
        - PRODUCT_KEY
    synonyms:
      - Product
      - Lot Tier
      - Price Mix
    dimensions:
      - name: PRODUCT_TIER
        description: Dimension for the priced lot variant a subscription holds, driving
          the price component of the inleg identity and Plus/Premium mix.
        expr: PRODUCT_NAME
        data_type: VARCHAR
  - name: TICKET_DRAW_FACT
    description: Grain of one ticket billed in one draw. Primary key is
      TICKET_DRAW_KEY. Do not add INLEG_EUR from this table to
      FCT_FINANCE_MONTH.
    base_table:
      database: POSTCODELOTERIJ
      schema: SAMPLE_SCHEMA
      table: FCT_TICKET_DRAW
    primary_key:
      columns:
        - TICKET_DRAW_KEY
    synonyms:
      - Billed ticket
    dimensions:
      - name: TICKET_DRAW_FACT
        description: Grain of one ticket billed in one draw. Primary key is
          TICKET_DRAW_KEY. Do not add INLEG_EUR from this table to
          FCT_FINANCE_MONTH.
        expr: TICKET_DRAW_KEY
        data_type: NUMBER
    facts:
      - name: GROSS_INLEG_TICKET_STAKES
        description: "Total consumer stakes across both lottery brands, computed as
          tickets in play multiplied by lot price for each recurring
          subscription draw. Includes standard, Plus and Premium tiers and all
          channels; excludes gaming tax, prize value and any operating cost.
          This is the licence-critical turnover denominator: afdracht
          percentage, cost ratio and prize payout ratio are all expressed
          against gross inleg. Sensitive to ticket price changes, tier mix and
          the stock of active recurring lots. It is the primary top-line volume
          metric for the Postcode Lottery Group."
        expr: INLEG_EUR
        data_type: NUMBER
      - name: PLUS_PREMIUM_TICKETS_IN_PLAY
        description: Stock of active lots subscribed at Plus and Premium.
        expr: IFF(PRODUCT_KEY IN (2, 3), 1, 0)
        data_type: NUMBER
      - name: AVERAGE_LOT_PRICE
        description: Average consumer price per recurring lot, weighted by tickets in
          play across the standard (€16), Plus (€18.50) and Premium (€21) tiers
          of Nationale Postcode Loterij and the VriendenLoterij price points.
          Excludes promotional discounts absorbed centrally. This price,
          multiplied by tickets in play, yields gross inleg, so it is a key
          sensitivity for turnover and afdracht. Movements reflect deliberate
          tier repricing or shifts in product mix rather than daily volatility.
        expr: TICKET_PRICE_EUR
        data_type: NUMBER
      - name: TICKETS_IN_PLAY_LOTEN
        description: Stock of active recurring lots participating in a given draw,
          aggregated across brands, product tiers and postcodes. Counts each
          subscribed lot once per draw; excludes cancelled or lapsed
          subscriptions and one-off promotional entries. It drives inleg
          (tickets times price) and underpins participation KPIs such as tickets
          per participant and Plus/Premium mix. Sensitive to acquisition, churn
          and multi-lot upsell. For Nationale Postcode Loterij it also
          determines the postcode win mechanic where neighbours win together.
        expr: TICKET_DRAW_KEY
        data_type: NUMBER
      - name: IS_UPGRADE
        description: 1 for Plus (PRODUCT_KEY 2) and Premium (PRODUCT_KEY 3). No subquery — Semantic View facts cannot use SELECT.
        expr: IFF(PRODUCT_KEY IN (2, 3), 1, 0)
        data_type: NUMBER
      - name: TICKETS_IN_PLAY
        description: One per billed ticket-draw row. SUM is tickets in play.
        expr: 1
        data_type: NUMBER
    metrics:
      - name: PLUS_PREMIUM_MIX
        description: Share of tickets in play subscribed at Plus and Premium tiers,
          computed as Plus/Premium tickets divided by total tickets in play. It
          is a key driver of average price and therefore inleg and afdracht at
          Nationale Postcode Loterij. Excludes standard-tier lots. Sensitive to
          upsell campaigns and perceived tier value. Monitored by the CRM team
          as a monetisation lever that raises stakes without new acquisition
          cost.
        expr: DIV0NULL(SUM(PLUS_PREMIUM_TICKETS_IN_PLAY), SUM(TICKETS_IN_PLAY))
relationships:
  - name: FINANCE_MONTH_TO_LOTTERY_BRAND
    left_table: FINANCE_MONTH
    right_table: LOTTERY_BRAND
    relationship_columns:
      - left_column: LOTTERY_KEY
        right_column: LOTTERY_KEY
  - name: FINANCE_MONTH_TO_MONTH
    left_table: FINANCE_MONTH
    right_table: MONTH
    relationship_columns:
      - left_column: DATE_KEY
        right_column: DATE_KEY
  - name: PRIZE_FACT_TO_DRAW_TYPE
    left_table: PRIZE_FACT
    right_table: DRAW_TYPE
    relationship_columns:
      - left_column: DRAW_KEY
        right_column: DRAW_KEY
  - name: PRIZE_FACT_TO_LOTTERY_BRAND
    left_table: PRIZE_FACT
    right_table: LOTTERY_BRAND
    relationship_columns:
      - left_column: LOTTERY_KEY
        right_column: LOTTERY_KEY
  - name: PRIZE_FACT_TO_MONTH
    left_table: PRIZE_FACT
    right_table: MONTH
    relationship_columns:
      - left_column: DATE_KEY
        right_column: DATE_KEY
  - name: PRIZE_FACT_TO_PRODUCT_TIER
    left_table: PRIZE_FACT
    right_table: PRODUCT_TIER
    relationship_columns:
      - left_column: PRODUCT_KEY
        right_column: PRODUCT_KEY
  - name: TICKET_DRAW_FACT_TO_DRAW_TYPE
    left_table: TICKET_DRAW_FACT
    right_table: DRAW_TYPE
    relationship_columns:
      - left_column: DRAW_KEY
        right_column: DRAW_KEY
  - name: TICKET_DRAW_FACT_TO_LOTTERY_BRAND
    left_table: TICKET_DRAW_FACT
    right_table: LOTTERY_BRAND
    relationship_columns:
      - left_column: LOTTERY_KEY
        right_column: LOTTERY_KEY
  - name: TICKET_DRAW_FACT_TO_MONTH
    left_table: TICKET_DRAW_FACT
    right_table: MONTH
    relationship_columns:
      - left_column: DATE_KEY
        right_column: DATE_KEY
  - name: TICKET_DRAW_FACT_TO_PRODUCT_TIER
    left_table: TICKET_DRAW_FACT
    right_table: PRODUCT_TIER
    relationship_columns:
      - left_column: PRODUCT_KEY
        right_column: PRODUCT_KEY
